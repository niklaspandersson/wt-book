name: Bygg och publicera boken

# Boken byggs och publiceras vid push till alla grenar.
# Den senaste pushen, oavsett gren, är den som syns på sidan.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Bara en publicering åt gången. En ny push avbryter en pågående körning.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installera Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      # Bara HTML. PDF-bygget fungerar inte på GitHub just nu.
      - name: Bygg HTML
        working-directory: manuscript
        run: quarto render --to html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: manuscript/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
