name: Bygg och publicera boken

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installera Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
          tinytex: true

      - name: Installera Chrome för mermaid-diagram i PDF
        run: quarto install chrome-headless-shell --no-prompt

      - name: Bygg HTML och PDF
        working-directory: manuscript
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: manuscript/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
