name: Bygg och publicera boken

# Boken byggs vid push till alla grenar, men publiceras bara från main.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# En körning per gren åt gången. En ny push avbryter en pågående körning
# på samma gren, men inte körningar på andra grenar.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installera Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      # Bara HTML. PDF-bygget fungerar inte på GitHub just nu.
      - name: Bygg HTML
        working-directory: manuscript
        run: quarto render --to html

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Ladda upp sidan för publicering
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: manuscript/_book

      # På andra grenar än main laddas den byggda boken upp som en vanlig
      # artefakt, så att den kan laddas ner och granskas från körningens sida.
      - name: Ladda upp boken som artefakt
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bok-html
          path: manuscript/_book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
